<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="robots" content="index,follow">
<title>Örnek Et — Menü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
/*__FONTS__*/
/*
 * ORTAK KATMAN: dört temanın paylaştığı bileşenler.
 * Buradaki her renk, motorun restaurant.accent'ten türettiği değişkenlerden gelir:
 *   --vurgu --vurgu-koyu --vurgu-acik --vurgu-sis --vurgu-metin
 *   --zemin --yuzey --yuzey-2 --murekkep --sessiz --cizgi --golge
 * Tema CSS'i bu değişkenleri EZMEZ; sadece tipografi, ölçü ve düzen ekler.
 */

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; scroll-behavior: smooth;
  /* Menüde kalın sistem kaydırma çubuğu ağır duruyor; ince ve sessiz olanı
     içerikten hiç rol çalmıyor. Firefox + WebKit/Blink ayrı ayrı yazılır. */
  scrollbar-width: thin;
  scrollbar-color: var(--cizgi) transparent;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--cizgi); border-radius: 999px;
  border: 2px solid transparent; background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--sessiz); background-clip: content-box; }
::-webkit-scrollbar-corner { background: transparent; }

/* Yatay şeritlerde (kategori çubuğu, rozet sırası) çubuk hiç görünmesin. */
.katlar, .filtre-liste, .rozetler { scrollbar-width: none; }
.katlar::-webkit-scrollbar, .filtre-liste::-webkit-scrollbar, .rozetler::-webkit-scrollbar { display: none; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

body {
  margin: 0;
  background: var(--zemin);
  color: var(--murekkep);
  font-family: var(--yazi-govde);
  font-size: 15px;
  line-height: 1.5;
  overflow-wrap: break-word;
}

img, video { max-width: 100%; display: block; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

/*
 * HAREKET: menüde hiçbir şey yerinden ışınlanmaz.
 * Dokunulan her yüzeyin rengi, kenarlığı ve gölgesi yumuşar; basılan düğme
 * hafifçe içeri çöker. (prefers-reduced-motion açıksa yukarıdaki kural
 * bütün süreleri sıfırlar, hareket tamamen kalkar.)
 */
button, .filtre-oge, #searchInput, .dil select, .bag {
  transition: background-color .22s ease, border-color .22s ease, color .22s ease,
              box-shadow .22s ease, opacity .22s ease, transform .14s ease;
}
button:active, .filtre-oge:active { transform: scale(.975); }
/* Kartlar büyük yüzeyler; onlarda çöküş daha az olmalı. */
.kart:active, .satir:active, .kutu:active { transform: scale(.988); }

/* Renk/görünüm değiştiğinde bütün yüzeyler birlikte dönüşsün (deneme
   çentiğinden renk seçilince menünün tamamı yumuşakça yeniden tonlanır). */
.renk-gecisi, .renk-gecisi *, .renk-gecisi *::before, .renk-gecisi *::after {
  transition: background-color .42s ease, color .42s ease, border-color .42s ease,
              box-shadow .42s ease, fill .42s ease, stroke .42s ease !important;
}
:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 2px; border-radius: 6px; }

.gizli-etiket {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/*
 * .sayfa'ya BİLEREK açılış animasyonu verilmiyor. Bin öğeden fazla taşıyan
 * bu ağacı opacity+transform ile canlandırmak telefonda takılma yapıyordu;
 * üstelik karşılama kapanıp `inert` kalktığı anda animasyon yeniden
 * tetikleniyor, yani tam menüye geçerken. Girişi kartların kendi kademeli
 * animasyonu (kartGir) zaten anlatıyor.
 */
.sayfa { max-width: 720px; margin: 0 auto; padding-inline: 16px; }

/* Arama/filtre sonrası liste yeniden kurulur; bölümler tek tek değil
   birlikte, kısa bir yükselişle gelir, liste "zıplamaz". */
.govde--yeni > * { animation: listeGir .26s cubic-bezier(.2,.7,.3,1) both; }
@keyframes listeGir { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

/*
 * Ürün kartları sırayla, çok küçük gecikmelerle sönümlenerek gelir.
 * Animasyon YALNIZCA ilk birkaç karta. Menüde yüzden fazla kart var ve
 * hepsine giriş animasyonu vermek, ekranda görünmeyenler dahil doksandan fazla
 * canlandırmayı aynı anda çalıştırmak demekti (her kategorinin kendi kart
 * listesi var); telefonda menüye geçiş bu yüzden takılıyordu. Animasyon
 * yalnızca ilk bölümün ilk kartlarında. Görünmeyen kartların animasyonu zaten kimseye
 * görünmüyor; onlar kaydırıldıkça görselleriyle birlikte sönümlenerek
 * geliyor.
 */
.bolum:first-child .urunler:first-of-type > *:nth-child(-n+6) {
  animation: kartGir .34s cubic-bezier(.2,.7,.3,1) both;
}
.bolum:first-child .urunler:first-of-type > *:nth-child(1) { animation-delay: .02s; }
.bolum:first-child .urunler:first-of-type > *:nth-child(2) { animation-delay: .05s; }
.bolum:first-child .urunler:first-of-type > *:nth-child(3) { animation-delay: .08s; }
.bolum:first-child .urunler:first-of-type > *:nth-child(4) { animation-delay: .11s; }
.bolum:first-child .urunler:first-of-type > *:nth-child(5) { animation-delay: .14s; }
.bolum:first-child .urunler:first-of-type > *:nth-child(6) { animation-delay: .16s; }
@keyframes kartGir { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/*
 * Görseller VARSAYILAN OLARAK GÖRÜNÜR. Yüklenen görsel bir kerelik
 * animasyonla sönümlenerek girer. Daha önce başlangıç değeri opacity:0'dı;
 * geçiş herhangi bir sebeple takılırsa (betik hatası, donmuş sekme)
 * görseller hiç görünmüyordu.
 */
.js-hazir img.yeni-yuklendi { animation: gorselGir .32s ease both; }
img.gorsel-yok { visibility: hidden; }
@keyframes gorselGir { from { opacity: 0; } to { opacity: 1; } }
.govde { padding-block: 8px 48px; }

/*
 * YAPIŞKAN BLOK: arama, filtre paneli, kategori çubuğu. Menü boyunca
 * ekranın tepesinde kalır. Motor yüksekliğini --yapiskan-h'ye yazar;
 * bölümler oraya göre durur, başlıkları çubuğun altında kalmaz.
 */
.yapiskan {
  position: sticky; top: 0; z-index: 30;
  margin-inline: -16px; padding-inline: 16px;
  background: var(--zemin);
}
/* Çubuk artık kendi başına yapışkan değil; bloğun içinde akar. */
.katlar { position: relative; }
.bolum { scroll-margin-top: calc(var(--yapiskan-h, 110px) + 10px); }
.bos { padding: 56px 0; text-align: center; color: var(--sessiz); }

/* ----------------------------------------------------- karşılama ekranı */

.giris {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; background: var(--zemin);
  transition: opacity .42s ease, transform .42s ease;
}
/* Menüye geçerken karşılama yerinde sönerek açılır, anında kaybolmaz. */
.giris.cikiyor { opacity: 0; transform: scale(1.045); pointer-events: none; }
.giris-medya {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  width: 100%; height: 100%; object-fit: cover;
}
.giris-perde { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
.giris-ic {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center; gap: 28px;
  padding: 24px;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
  text-align: center;
  animation: girisYukari .9s cubic-bezier(.2,.7,.3,1) both;
}
.giris-logo { width: auto; height: auto; max-height: 42vh; object-fit: contain; }
.giris-ad {
  margin: 0; font-family: var(--yazi-baslik);
  font-size: clamp(34px, 11vw, 58px); font-weight: 700; letter-spacing: .02em;
  color: #fff; text-shadow: 0 2px 24px rgb(0 0 0 / .45);
}
.giris-dugme {
  padding: 14px 42px; min-height: 48px;
  border: 0; border-radius: 999px;
  background: var(--vurgu); color: var(--vurgu-metin);
  font-family: var(--yazi-baslik);
  font-size: 13px; font-weight: 700; letter-spacing: .22em;
  box-shadow: 0 10px 34px hsla(var(--vurgu-h), 60%, 20%, .45);
  transition: transform .18s ease, box-shadow .18s ease;
}
/* Üzerine gelme efektleri yalnızca fareli cihazda: telefonda dokunulan
   öğede takılı kalıyor, parmak kalktıktan sonra da vurgulu görünüyordu. */
@media (hover: hover) and (pointer: fine) {
  .giris-dugme:hover { transform: translateY(-2px); box-shadow: 0 14px 40px hsla(var(--vurgu-h), 60%, 20%, .55); }
}
@keyframes girisYukari { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }

/* ------------------------------------------------------------- rozetler */

.rozetler { display: flex; flex-wrap: wrap; gap: 6px; }
.rozet {
  display: inline-block; padding: 3px 8px; border-radius: 999px;
  font-size: 10.5px; font-weight: 700; letter-spacing: .05em; white-space: nowrap;
}
.rozet--populer { background: var(--vurgu); color: var(--vurgu-metin); }
.rozet--sef { background: var(--vurgu-sis); color: var(--vurgu-koyu); border: 1px solid var(--vurgu-acik); }
/* Zemini ve yazısı ayrı ayarlanabilir; koyu/açık ayrımını motor yapar. */
.rozet--vegan, .rozet--vejetaryen { background: var(--diyet); color: var(--diyet-yazi); }

/* ------------------------------------------------------- arama + filtre */

#searchInput {
  flex: 1 1 auto; min-width: 0; height: 42px;
  padding-inline: 14px;
  border: 1px solid var(--cizgi); border-radius: 12px;
  background: var(--yuzey); color: var(--murekkep);
  font-size: 14px;
}
#searchInput::placeholder { color: var(--sessiz); }

.filtre-dugme {
  position: relative; flex: 0 0 auto;
  width: 42px; height: 42px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--cizgi); border-radius: 12px;
  background: var(--yuzey); color: var(--sessiz);
}
.filtre-dugme.etkin { border-color: var(--vurgu); color: var(--vurgu-yazi); }
.filtre-sayi {
  position: absolute; top: -6px; inset-inline-end: -6px;
  min-width: 18px; height: 18px; padding: 0 4px;
  border-radius: 999px; background: var(--vurgu); color: var(--vurgu-metin);
  font-size: 10px; font-weight: 700; line-height: 18px; text-align: center;
}

/*
 * Filtre paneli `hidden` ile anında açılıp kapanıyordu. Artık yüksekliğiyle
 * birlikte açılır; kapalıyken yer kaplamaz ve klavyeye de kapalıdır.
 */
.filtre {
  overflow: hidden; visibility: hidden;
  max-height: 0; opacity: 0;
  margin-block: 0; padding: 0 14px;
  border: 0 solid var(--cizgi); border-radius: 14px;
  background: var(--yuzey);
  transition: max-height .3s cubic-bezier(.2,.7,.3,1), opacity .24s ease,
              margin-block .3s ease, padding .3s ease, visibility .3s;
}
.filtre--acik {
  visibility: visible;
  /* Yapışkan bloğun içinde: ekranın yarısından fazlasını kaplamasın,
     taşarsa kendi içinde kaysın. */
  max-height: 420px; max-height: min(420px, 55vh);
  overflow-y: auto; overscroll-behavior: contain;
  opacity: 1;
  margin-block: 10px; padding: 14px;
  border-width: 1px;
}
.filtre-ust { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.filtre-liste { display: flex; flex-wrap: wrap; gap: 8px; }
.filtre-oge {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 12px; min-height: 40px;
  border: 1px solid var(--cizgi); border-radius: 999px;
  background: var(--zemin); font-size: 13px; cursor: pointer;
}
.filtre-oge.secili { border-color: var(--vurgu); background: var(--vurgu-sis); color: var(--vurgu-sis-yazi); }
.filtre-oge input { accent-color: var(--vurgu); width: 15px; height: 15px; }
.bag { border: 0; background: none; color: var(--vurgu-yazi); font-size: 13px; font-weight: 600; text-decoration: underline; }

/* --------------------------------------------------------- dil seçici */

/*
 * Dil seçici. Oku eskiden iki linear-gradient üçgeniyle çiziliyordu; hem
 * tarihi bir görünüşü vardı hem de bazı zeminlerde kayboluyordu. Şimdi ok
 * sarmalayıcının ::after'ında currentColor ile çizilir, kutu da yüzey
 * rengini kullanır, yani hangi renk seçilirse seçilsin kendi zeminiyle
 * birlikte değişir.
 */
.dil { position: relative; display: inline-flex; align-items: center; }
.dil select {
  height: 36px; padding-inline: 13px 32px;
  border: 1px solid var(--cizgi); border-radius: 999px;
  background: var(--yuzey); color: var(--murekkep);
  font-size: 12.5px; font-weight: 600; letter-spacing: .01em;
  appearance: none; -webkit-appearance: none;
  cursor: pointer;
}
@media (hover: hover) and (pointer: fine) { .dil select:hover { border-color: var(--vurgu); } }
/* Açılan listedeki satırlar tarayıcının kendi yüzeyinde çizilir; renkleri
   açıkça vermezsek koyu temada okunmayan kombinasyonlar çıkıyor. */
.dil select option { background: var(--yuzey); color: var(--murekkep); }

.dil::after {
  content: ""; position: absolute; inset-inline-end: 14px; top: 50%;
  width: 7px; height: 7px; margin-top: -2px;
  border-inline-end: 1.8px solid currentColor; border-block-end: 1.8px solid currentColor;
  transform: translateY(-50%) rotate(45deg);
  color: var(--sessiz);
  pointer-events: none;
}

/* ------------------------------------------------ başlıktaki bilgi düğmesi */

.ust-araclar { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.bilgi-dugme {
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding-inline: 11px 14px;
  border: 1px solid var(--cizgi); border-radius: 999px;
  background: var(--yuzey); color: var(--murekkep);
  font-size: 12.5px; font-weight: 600; letter-spacing: .01em; white-space: nowrap;
}
.bilgi-dugme svg { color: var(--vurgu-yazi); flex: none; }
/* İşletme adı ve logosu da kartı açar. */
[data-bilgi-ac] { cursor: pointer; }
.ust-kimlik[data-bilgi-ac]:active { opacity: .72; }
/* Çok dar ekranda (320 px) yazı düşer, ikon kalır. */
@media (max-width: 350px) {
  .bilgi-dugme { width: 36px; padding: 0; justify-content: center; }
  .bilgi-dugme span { display: none; }
}

/* ------------------------------------------------- restoran bilgi kartı */

.bl-ust { display: flex; align-items: center; gap: 14px; }
.bl-logo {
  width: 58px; height: 58px; flex: none; padding: 7px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--cizgi); border-radius: 16px; overflow: hidden;
  /* Logolar çoğunlukla koyu çizimli; koyu temada da seçilsin diye açık
     zemin. Açık renkli logo (logoLight) koyu zemine oturur. */
  background: #fff;
}
.bl-logo--acik { background: hsl(var(--vurgu-h), 14%, 12%); }
.bl-logo img { width: 100%; height: 100%; object-fit: contain; }
.bl-kimlik { min-width: 0; }
.bl-kimlik h3 { margin: 0; font-family: var(--yazi-baslik); font-size: 21px; line-height: 1.2; text-wrap: balance; }
.bl-kimlik p { margin: 3px 0 0; font-size: 12.5px; color: var(--sessiz); }

.bl-liste { display: flex; flex-direction: column; }
.bl-satir {
  position: relative;
  display: flex; align-items: center; gap: 13px;
  width: 100%; min-height: 50px; padding: 13px 0;
  border-top: 1px solid var(--cizgi);
  color: var(--murekkep); text-decoration: none; text-align: start;
  font-size: 15px; letter-spacing: -.005em;
}
.bl-satir:first-child { border-top: 0; }
.bl-satir > svg { color: var(--sessiz); flex: none; }
.bl-ad { flex: 1 1 auto; min-width: 0; color: var(--sessiz); }
.bl-deger {
  display: inline-flex; align-items: center; gap: 7px; flex: 0 1 auto;
  font-weight: 600; text-align: end;
}
a.bl-satir .bl-deger, .bl-satir--dil .bl-deger { color: var(--vurgu-yazi); }
a.bl-satir, .bl-satir--dil { transition: opacity .15s ease; }
a.bl-satir:active, .bl-satir--dil:active { opacity: .6; }
[dir="rtl"] .bl-deger svg { transform: scaleX(-1); }
/* Dil satırı: görünmez yerel seçici satırın tamamını kaplar. 16 px yazı,
   iOS'un odaklanınca sayfayı yakınlaştırmasını engeller. */
.bl-satir--dil { cursor: pointer; }
.bl-satir--dil select {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  opacity: 0; cursor: pointer; font-size: 16px;
  -webkit-appearance: none; appearance: none;
}
.bl-durum {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 700; letter-spacing: .03em;
  background: var(--diyet); color: var(--diyet-yazi);
}
.bl-durum--kapali { background: hsla(4, 75%, 55%, .14); color: hsl(4, 68%, 42%); }
[data-mod="koyu"] .bl-durum--kapali { color: hsl(4, 85%, 72%); }
.bl-yildiz { color: hsl(42, 96%, 50%); letter-spacing: 1px; }

/* Gıda denetimi bölümü, işletmenin verdiği Bakanlık bağlantısı. */
.bl-bolum { border-top: 1px solid var(--cizgi); padding-top: 14px; }
.bl-bolum h4 {
  margin: 0 0 2px; font-size: 11px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase; color: var(--sessiz);
}
.bl-yasal {
  margin: 0; padding-top: 12px; border-top: 1px solid var(--cizgi);
  font-size: 12px; line-height: 1.55; color: var(--sessiz);
}

/* Alkol ve domuz kaynaklı bileşen, Türkiye'ye özgü zorunlu beyan. Kartta
   rozet, detayda kendi "İçerik" satırı. Uyarı rengi vurgudan türemez: her
   temada aynı kehribar ton, anlamı sabit kalsın. */
.rozet--alkol, .rozet--domuz { background: hsl(38, 92%, 90%); color: hsl(28, 80%, 26%); }
[data-mod="koyu"] .rozet--alkol, [data-mod="koyu"] .rozet--domuz { background: hsl(34, 45%, 18%); color: hsl(40, 90%, 72%); }
.dt-uyari { margin: 0 0 4px; font-size: 14px; font-weight: 600; }

/* ------------------------------------------------------- ürün detayı */

.dt-ortu {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 70;
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0;
  animation: ortuGir .2s ease both;
}
/*
 * Perde KENDİ katmanında. Sürüklerken yalnızca opacity'si değişir; opacity
 * compositor'da işlenir, stil hesabı da boyama da gerektirmez.
 *
 * Eskiden ilerleme örtüye CSS değişkeni olarak yazılıyor ve hem arka planın
 * bulanıklığını hem zeminini besliyordu: parmak her kıpırdadığında bütün
 * arka plan yeniden bulanıklaşıyor, kutunun tüm içeriği için stil yeniden
 * hesaplanıyordu. Telefonda hareket bu yüzden takılıyordu.
 */
.dt-perde {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  background: hsla(var(--vurgu-h), 30%, 4%, .72);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  will-change: opacity;
}
/* Kapanırken perde de sönsün; kutu aşağı süzülürken arkası açılır. */
.dt-ortu.kapanir .dt-perde { opacity: 0; transition: opacity .22s ease; }
@media (min-width: 560px) { .dt-ortu { align-items: center; padding: 24px; } }

.dt-kutu {
  position: relative;
  width: 100%; max-width: 480px;
  /*
   * Yukseklik ORTUNUN yuksekligine gore sinirlanir, vh/dvh'ye gore degil:
   * iOS'ta 100vh gorunur alandan buyuk oldugu icin kutunun ustu -- tutamac
   * ve kapatma dugmesi -- ekran disina tasiyor, kutu kapatilamaz hale
   * geliyordu. Ustte her zaman 64 piksel bos kalir; oraya dokunmak da kapatir.
   */
  max-height: calc(100% - 64px);
  /* Kaydırma .dt-kaydir'da; kutu sabit kalır ki tutamaç ve kapatma
     düğmesi içerikle birlikte kayıp gitmesin. */
  overflow: hidden;
  display: flex; flex-direction: column;
  background: var(--yuzey); color: var(--murekkep);
  border-radius: 22px 22px 0 0;
  box-shadow: var(--golge);
  /*
   * Açılış BİLEREK keyframe değil transition ile yapılıyor. Keyframe
   * animasyonu (fill: both) bittikten sonra da transform'u sahiplenir ve
   * sürüklerken yazdığımız inline translateY'yi eziyordu: kutu parmağı
   * takip etmiyordu. Transition'da aynı özelliği hem açılış hem sürükleme
   * hem kapanış paylaşır.
   */
  transform: translateY(100%); opacity: 0;
  transition: transform .24s cubic-bezier(.2,.8,.3,1), opacity .2s ease;
  will-change: transform;
}
.dt-kutu.acildi { transform: none; opacity: 1; }
/*
 * Kutu EN ÜSTTEYKEN dokunma jestini tarayıcıya bırakmıyoruz. `pan-y` iken
 * parmak aşağı indiği anda tarayıcı kaydırmayı üstlenip olaylarımızı
 * `pointercancel` ile kesiyordu: aşağı çekerek kapatmak gerçek telefonda
 * tutmuyordu. Bu durumda iki yönü de motor yönetir (bkz. suruklemeyiBagla).
 */
.dt-kaydir {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto;
  /* Kutunun sonuna gelince kaydırma arkadaki menüye geçmesin. */
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  /* Kaydırılmış durumdayken dikey kaydırma tarayıcının işi. */
  touch-action: pan-y;
  scrollbar-width: thin; scrollbar-color: var(--cizgi) transparent;
}
.dt-kaydir::-webkit-scrollbar { width: 6px; }
.dt-kaydir::-webkit-scrollbar-thumb { background: var(--cizgi); border-radius: 999px; border: 0; }
.dt-kaydir--ustte { touch-action: none; }
/* Kutu en üstteyken basılı tutma, metin seçimi balonunu çıkarıp jesti
   kesiyordu; orada seçimi kapatıyoruz. Kaydırıldıktan sonra metin yine
   seçilebilir. */
.dt-kaydir--ustte { -webkit-touch-callout: none; }
/*
 * Sürükleme sırasında: geçiş kapanır (parmağı anlık takip etsin), kutunun
 * kendi kaydırması ve metin seçimi durur. Üçü aynı anda açıkken hareket
 * takılıyor, yazılar maviye boyanıyordu.
 */
.dt-kutu.suruklenir {
  transition: none;
  user-select: none; -webkit-user-select: none;
  cursor: grabbing;
}
/* Sürüklerken iç kaydırma da durur; ikisi aynı anda takılma yapıyordu. */
.dt-kutu.suruklenir .dt-kaydir { overflow-y: hidden; touch-action: none; }
/*
 * Sürüklerken kutunun İÇİNDEKİ pahalı işler kapanır. Kapatma düğmesinin
 * bulanıklığı kutuyla birlikte hareket ettiği için her karede yeniden
 * hesaplanıyordu; görünümü neredeyse aynı kalacak biçimde donduruluyor.
 */
.dt-kutu.suruklenir .dt-kapat {
  -webkit-backdrop-filter: none; backdrop-filter: none;
  background: hsla(var(--vurgu-h), 20%, 8%, .82);
}
.dt-kaydir { scrollbar-gutter: stable; }
.dt-kutu:focus { outline: none; }
/* Geniş ekranda kutu ortada durur; oradan tam boy aşağı kaymak yerine
   kısa bir yükseliş daha doğru duruyor. */
@media (min-width: 560px) { .dt-kutu { border-radius: 22px; transform: translateY(26px); } }



/*
 * Telefonda kapatma düğmesi ekranın tepesinde kalıyor ve başparmakla zor
 * erişiliyor. Tutamaç hem "bu kutu aşağı çekilebilir" işareti hem de
 * sürüklemenin güvenli tutma yeri. Fare/masaüstünde gereksiz: gizlenir.
 */
.dt-tutamac {
  /* Basılı tutunca çıkan metin seçimi ve bağlam menüsü jesti bozuyordu. */
  user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
  /* Sadece ortadaki şerit kadar yer kaplar: tüm genişliği kaplasaydı
     kapatma düğmesinin üstüne binip tıklamayı yutardı. */
  position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 3;
  width: 150px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  cursor: grab; touch-action: none;
}
.dt-tutamac span {
  width: 48px; height: 5px; border-radius: 999px;
  background: hsla(0, 0%, 100%, .72);
  box-shadow: 0 1px 4px hsla(var(--vurgu-h), 30%, 6%, .5);
}
/* Görseli olmayan üründe kutu doğrudan yüzey rengiyle başlar; orada beyaz
   tutamaç kaybolurdu. */
.dt-kutu--yazi .dt-tutamac span { background: var(--cizgi); box-shadow: none; }
.dt-kutu--yazi .dt-kapat { background: var(--yuzey-2); color: var(--murekkep); }
/* Masaüstünde de durur: fareyle sürüklemenin tek başlangıç noktası burası,
   görünmezse kullanıcı nereden tutacağını bilemiyor. Orada daha soluk. */
@media (min-width: 560px) {
  .dt-tutamac { height: 30px; }
  .dt-tutamac span { width: 40px; height: 4px; opacity: .72; }
}
.dt-tutamac:active { cursor: grabbing; }

.dt-kapat {
  /* 44x44: parmakla rahat vurulan en kucuk hedef. */
  position: absolute; top: 10px; right: 10px; z-index: 4;
  width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  border: 0; border-radius: 999px;
  background: hsla(var(--vurgu-h), 20%, 8%, .72); color: #fff;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  box-shadow: 0 2px 10px hsla(var(--vurgu-h), 30%, 6%, .35);
}
[dir="rtl"] .dt-kapat { right: auto; left: 10px; }
.dt-kapat:active { transform: scale(.92); }
/* aspect-ratio'yu anlamayan cihazlarda görsel alanı yükseklik alamıyordu;
   padding-top yedeği ile 4/3 oranı korunur. overflow: hidden şart, yoksa
   kare fotoğraf kutuyu kendi boyuna esnetiyor, görsel yüklenince kutu
   içeriği aşağı zıplıyordu. */
.dt-gorsel { position: relative; padding-top: 75%; overflow: hidden; background: var(--yuzey-2); }
.dt-gorsel img { position: absolute; top: 0; left: 0; }
@supports (aspect-ratio: 4 / 3) {
  .dt-gorsel { aspect-ratio: 4 / 3; padding-top: 0; }
  .dt-gorsel img { position: static; }
}
/* Görselsiz kutuda tutamaç ile ilk satır çakışmasın. */
.dt-kutu--yazi .dt-govde { padding-top: 40px; }
.dt-gorsel img { width: 100%; height: 100%; object-fit: cover; }
.dt-govde {
  padding: 18px 18px 26px;
  /* iPhone'da alt çubuk şeridi son satırı yiyordu (viewport-fit=cover). */
  padding-bottom: calc(26px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 14px;
}
.dt-ust { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
.dt-ust h3 { margin: 0; font-family: var(--yazi-baslik); font-size: 22px; line-height: 1.2; text-wrap: balance; }
.dt-tutar { flex: 0 0 auto; font-size: 17px; font-weight: 700; color: var(--vurgu-yazi); font-variant-numeric: tabular-nums; }
.dt-aciklama { margin: 0; color: var(--sessiz); line-height: 1.6; }

.dt-blok { border-top: 1px solid var(--cizgi); padding-top: 14px; }
.dt-blok h4 {
  margin: 0 0 8px; font-size: 11px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase; color: var(--sessiz);
}
.dt-satir { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.dt-satir h4 { margin: 0; }

.dt-porsiyon { width: 100%; border-collapse: collapse; font-size: 14px; }
.dt-porsiyon th, .dt-porsiyon td { padding: 8px 0; text-align: start; border-bottom: 1px solid var(--cizgi); }
.dt-porsiyon tr:last-child th, .dt-porsiyon tr:last-child td { border-bottom: 0; }
.dt-porsiyon th { font-weight: 600; }
.dt-olcu { color: var(--sessiz); font-size: 12px; white-space: nowrap; padding-inline: 10px; }
.dt-fiyat { text-align: end; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dt-alerjen p { margin: 0 0 6px; font-size: 13.5px; line-height: 1.5; }
.dt-olabilir { color: var(--sessiz); }

@keyframes ortuGir { from { opacity: 0; } to { opacity: 1; } }


/* ------------------------------------------------------------ ortak alt */

.altbilgi {
  padding-block: 22px calc(34px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--cizgi);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px; font-size: 12px; color: var(--sessiz);
}
.altbilgi a { color: var(--vurgu-yazi); text-decoration: none; font-weight: 600; }
.altbilgi-baglar { display: flex; flex-wrap: wrap; gap: 14px; }

/* Geliştirici imzası, altbilginin en altında, kendi satırında. */
.imza {
  flex: 1 0 100%;
  padding-top: 12px; margin-top: 4px;
  border-top: 1px solid var(--cizgi);
  font-size: 11.5px; color: var(--sessiz); text-align: center;
}
.imza a {
  color: var(--sessiz); font-weight: 700; text-decoration: none;
  border-bottom: 1px solid var(--cizgi);
}
@media (hover: hover) and (pointer: fine) {
  .imza a:hover { color: var(--vurgu-yazi); border-bottom-color: var(--vurgu-yazi); }
}

/* KADRAJ: tipografi, ölçü, düzen. Renkler ortak değişkenlerden gelir. */

:root {
  --yazi-baslik: Archivo, "Segoe UI", system-ui, sans-serif;
  --yazi-govde: Archivo, "Segoe UI", system-ui, sans-serif;
}

/* ------------------------------------------------------------- başlık */

.ust { position: relative; margin-inline: -16px; }
.ust-kapak { position: relative; height: 240px; overflow: hidden; }
.ust-kapak--bos { height: 132px; background: var(--vurgu-sis); }
.ust-kapak img { width: 100%; height: 100%; object-fit: cover; }
.ust-perde {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  background: linear-gradient(180deg,
    hsla(var(--vurgu-h), 28%, 6%, .58) 0%,
    hsla(var(--vurgu-h), 28%, 6%, .12) 42%,
    hsla(var(--vurgu-h), 28%, 6%, .86) 100%);
}
.ust-ic {
  position: absolute; inset: 0 0 auto; height: 240px;
  padding: 18px 16px 20px;
  display: flex; flex-direction: column; justify-content: space-between;

    s /= 100; l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
    var m = l - c / 2;

    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
  }

  /**
   * Bir tonu, verilen zemine karşı `hedef` kontrast oranını tutturana kadar
   * açar ya da koyulaştırır. Rengin kimliği (ton + doygunluk) korunur,
   * yalnızca açıklığı kayar.
   *
   * Buna ihtiyaç var çünkü ham vurgu rengi metin olarak her zeminde
   * okunmuyor: sarı bir vurgu beyaz kartta 1.4:1 kalıyordu, yani görünmez.
   */

    var zr = renkRgb(zemin);
    if (!zr) return hsl(h, sat, l);
    var zeminAcik = luminans(zr) > 0.4;
    var adim = zeminAcik ? -1 : 1;
    for (var i = 0; i <= 100; i++) {
      var renk = hsl(h, sat, l);
      var oran = kontrast(renk, zemin);
      if (oran == null || oran >= hedef) return renk;
      l += adim;
      if (l < 0 || l > 100) break;
    }
    return hsl(h, sat, Math.max(0, Math.min(100, l)));

  /**

   * geçebiliyor. Önce ikisini birden tutturmaya çalışır; zemin ile kart zıt
   * tonlardaysa KARTI korur, çünkü metnin çoğu kartın içindedir. (Panelin
   * okunabilirlik tablosu bu durumda sayfa satırını kırmızı gösterir, yani
   * ayarı yapan kişi zemini de düzeltebilir.)
   */
  function ikiZemine(h, sat, l, birincil, ikincil, hedef) {
    var a = okunurTon(h, sat, l, birincil, hedef);
    if ((kontrast(a, ikincil) || 21) >= hedef) return a;
    var b = okunurTon(h, sat, l, ikincil, hedef);

    var L = luminans(rgb);

  function vurguUstuMetin(hex, c) {

    return siyahla >= beyazla ? "#15110f" : "#ffffff";

  function paraTL(kurus) {

   * detayındaki porsiyon tablosunda zaten satır satır yazıyor.
   * Yalnız bilerek 0 girilmiş fiyat "İkram" sayılır. Fiyatı hiç girilmemiş
   * ürün (null) ikram DEĞİLDİR: porsiyonu varsa en düşük porsiyon fiyatı,
   * yoksa boş gösterilir (müşteri bedava sanmasın).
   */

    if (u.price || u.priceMax) return paraTL(u.price || u.priceMax);

      var f = u.portions[i].price;

  function Motor(veri, skin) {
    this.veri = veri || {};

    this.kategoriler = Array.isArray(this.veri.categories) ? this.veri.categories : [];
    this.altlar = this.veri.subs || {};
    this.alerjenler = Array.isArray(this.veri.allergens) ? this.veri.allergens : [];
    this.i18n = this.veri.i18n || {};

    this.diller = this.dilleriBul();
    this.durum = {
      dil: this.diller[0] || "tr",
      arama: "",
      gizli: [],                    /* seçili alerjen anahtarları */
      acikUrun: null,
      bilgi: false,                 /* restoran bilgi kartı açık mı */
      filtrePaneli: false,
      giris: !!this.karsilamaVar()

    this.yerelYukle();
  }

  Motor.prototype.dilleriBul = function () {
    var d = ["tr"];
    var ornek = this.kategoriler[0] && this.kategoriler[0].products && this.kategoriler[0].products[0];
    if (ornek && ornek.nameEn) d.push("en");
    for (var k in this.i18n) if (SOZLUK[k] && d.indexOf(k) < 0) d.push(k);
    return d;
  };

  Motor.prototype.sz = function () { return SOZLUK[this.durum.dil] || SOZLUK.tr; };

  Motor.prototype.karsilamaVar = function () {
    var w = this.isletme.welcome;
    return !!(w && (w.media || w.logo));
  };

  /* Dil ve alerjen seçimi cihazda hatırlanır (panelden gelen veriyi değiştirmez). */
  Motor.prototype.yerelAnahtar = function () { return "cm:" + (this.veri.slug || "menu"); };
  Motor.prototype.yerelYukle = function () {
    try {
      var s = JSON.parse(localStorage.getItem(this.yerelAnahtar()) || "{}");
      if (s.dil && this.diller.indexOf(s.dil) >= 0) this.durum.dil = s.dil;
      if (Array.isArray(s.gizli)) this.durum.gizli = s.gizli;
    } catch (e) { /* özel sekmede sessizce geç */ }
  };
  Motor.prototype.yerelYaz = function () {
    try {
      localStorage.setItem(this.yerelAnahtar(),
        JSON.stringify({ dil: this.durum.dil, gizli: this.durum.gizli }));
    } catch (e) { /* yoksay */ }
  };

  /** Ürün/kategori adını ve açıklamasını seçili dilde döndürür. */
  Motor.prototype.metin = function (nesne) {
    var dil = this.durum.dil;
    if (dil === "tr") return { ad: nesne.name || "", desc: nesne.desc || "" };
    if (dil === "en") return { ad: nesne.nameEn || nesne.name || "", desc: nesne.descEn || nesne.desc || "" };

    return {
      ad: (t && t.n) || nesne.nameEn || nesne.name || "",
      desc: (t && t.d) || nesne.descEn || nesne.desc || ""
    };

  Motor.prototype.altAdi = function (anahtar) {

    if (!a) return "";

  Motor.prototype.alerjenAdi = function (anahtar) {
    if (anahtar === "@alkol") return this.sz().alkol;
