       Nötrler vurguya doğru hafifçe eğilir, "seçilmiş" bir gri verir. */
    oneri["zemin"]   = koyu ? hsl(c.h, 14, 7)  : hsl(c.h, 24, 97);
    oneri["yuzey"]   = koyu ? hsl(c.h, 12, 11) : "#ffffff";
    oneri["yuzey-2"] = koyu ? hsl(c.h, 11, 15) : hsl(c.h, 22, 94);

    var zeminGercek = ezme["zemin"] || oneri["zemin"];
    var yuzeyGercek = ezme["yuzey"] || oneri["yuzey"];

    /* 2) Metinler, gerçek yüzeye karşı kontrast garantili.
       Gövde yazısı 7:1 (AAA), yardımcı metin ve renkli yazı 4.5:1 (AA). */
    oneri["murekkep"] = ikiZemine(c.h, koyu ? 16 : 22, koyu ? 95 : 11, yuzeyGercek, zeminGercek, 7);
    oneri["sessiz"]   = ikiZemine(c.h, 9, koyu ? 68 : 42, yuzeyGercek, zeminGercek, 4.6);

    /* 3) Vurgu: ham hâli ZEMİN olarak kullanılır (düğme, rozet), ayrıca
       yüzey üstünde yazı olarak okunan bir varyantı üretilir. */
    oneri["vurgu"]       = hsl(c.h, c.s, c.l);
    oneri["vurgu-yazi"]  = okunurTon(c.h, c.s, c.l, yuzeyGercek, 4.5);
    oneri["vurgu-koyu"]  = hsl(c.h, Math.min(100, c.s + 4), Math.max(14, c.l - 13));
    oneri["vurgu-acik"]  = hsl(c.h, Math.max(12, c.s - 26), koyu ? c.l + 22 : Math.min(96, c.l + 42));
    oneri["vurgu-sis"]   = hsl(c.h, Math.max(10, c.s - 30), koyu ? 22 : 95);
    /* Seçili alerjen etiketi gibi yerlerde zemin "vurgu sisi" olur; oradaki
       yazı da okunmalı (koyu modda sis koyu, vurgu-koyu da koyuydu). */
    oneri["vurgu-sis-yazi"] = okunurTon(c.h, Math.min(100, c.s + 4), Math.max(14, c.l - 13),
                                        ezme["vurgu-sis"] || oneri["vurgu-sis"], 4.5);
    /* Vurgu zemini üstündeki yazı, ezilmiş vurguyu da hesaba katar. */
    oneri["vurgu-metin"] = zemineGoreYazi(ezme["vurgu"] || this.isletme.accent || oneri["vurgu"]);

    /* Diyet rozeti (vegan / vejetaryen) çift renkli: zemini ve yazısı ayrı
       ayarlanır. Yeşil anlamsal olduğu için vurgudan türemez, ama yazısı
       yine de seçilen zemine karşı okunur tutulur. */
    oneri["diyet"] = koyu ? hsl(140, 30, 18) : hsl(140, 34, 92);
    oneri["diyet-yazi"] = okunurTon(140, 46, koyu ? 76 : 22, ezme["diyet"] || oneri["diyet"], 4.5);

    oneri["cizgi"] = koyu ? hsl(c.h, 10, 20) : hsl(c.h, 18, 88);
    oneri["golge"] = koyu
      ? "0 10px 30px hsla(" + Math.round(c.h) + ", 40%, 3%, 0.55)"
      : "0 8px 24px hsla(" + Math.round(c.h) + ", 30%, 20%, 0.10)";

    return { oneri: oneri, c: c, koyu: koyu };
  };

  /**
   * Paleti yazar. Her rol önce vurgudan türetilir; `restaurant.renkler`
   * içinde aynı adla bir değer varsa o kazanır:
   *
   *   "renkler": { "zemin": "#101014", "yuzey": "#191922", "murekkep": "#f2f2f7" }
   *
   * Böylece işletme tek renk verip her şeyi otomatik alabilir ya da
   * istediği rolü (zemin, kart, yazı, vurgu üstü yazı...) tek tek ayarlar.
   */
  Motor.prototype.paletiUygula = function () {
    var h = this.paletOner();
    var k = document.documentElement.style;
    var ezme = this.isletme.renkler || {};

    for (var ad in h.oneri) {
      if (!Object.prototype.hasOwnProperty.call(h.oneri, ad)) continue;
      var deger = ezme[ad];
      k.setProperty("--" + ad, (deger == null || deger === "") ? h.oneri[ad] : deger);
    }
    /* Gökyüzü ve cam gibi tema hesapları ham vurgu tonuna bakar. */
    k.setProperty("--vurgu-h", String(h.c.h));
    k.setProperty("--vurgu-s", h.c.s + "%");

    /* Temanın kendi türettiği değişkenler (ör. Günbatımı'nın gökyüzü
       durakları). Ortak paleti ezmez, üstüne ekler. */
    if (typeof this.skin.paletEk === "function") this.skin.paletEk(k, h.c, h.koyu);

    document.documentElement.setAttribute("data-mod", h.koyu ? "koyu" : "acik");
    document.documentElement.setAttribute("dir", this.durum.dil === "ar" ? "rtl" : "ltr");
    document.documentElement.setAttribute("lang", this.durum.dil);
    var tema = document.querySelector('meta[name="theme-color"]');
    if (tema) {
      var zemin = ezme["zemin"] || h.oneri["zemin"];
      tema.setAttribute("content", zemin);
    }
  };

  /* --------------------------------------------------------- süzgeçler */

  Motor.prototype.urunGorunur = function (u) {
    var d = this.durum;
    if (d.gizli.length) {
      var hepsi = (u.allergens || []).concat(u.possible || []);
      /* Alkol ve domuz kaynaklı bileşen alerjen değil ama misafir aynı
         biçimde süzmek istiyor; sanal anahtarla aynı listeye katılır. */
      if (u.alcohol) hepsi.push("@alkol");
      if (u.pork) hepsi.push("@domuz");
      for (var i = 0; i < d.gizli.length; i++) if (hepsi.indexOf(d.gizli[i]) >= 0) return false;
    }
    if (d.arama) {
      var t = this.metin(u);
      var havuz = (t.ad + " " + t.desc + " " + (u.name || "")).toLocaleLowerCase("tr");
      if (havuz.indexOf(d.arama.toLocaleLowerCase("tr")) < 0) return false;
    }
    return true;
  };

  /** Kategoriyi alt başlıklara böler: [{ad, urunler}], alt başlıksızlar başta. */
  Motor.prototype.altlaraBol = function (kat) {
    var sira = [], harita = {};
    var urunler = (kat.products || []).filter(this.urunGorunur, this);
    for (var i = 0; i < urunler.length; i++) {
      var u = urunler[i], anahtar = u.sub || "";
      if (!harita[anahtar]) { harita[anahtar] = { ad: anahtar ? this.altAdi(anahtar) : "", urunler: [] }; sira.push(harita[anahtar]); }
      harita[anahtar].urunler.push(u);
    }
    return sira;
  };

  /* ------------------------------------------------------------ parçalar */

  /** Rozetler: popüler / şefin seçimi / diyet. */
  Motor.prototype.rozetler = function (u) {
    var sz = this.sz(), r = [];
    if (u.popular) r.push({ tur: "populer", ad: sz.populer });
    if (u.chef) r.push({ tur: "sef", ad: sz.sef });
    if (u.diet === "vegan") r.push({ tur: "vegan", ad: sz.vegan });
    else if (u.diet === "vegetarian") r.push({ tur: "vejetaryen", ad: sz.vejetaryen });
    if (u.alcohol) r.push({ tur: "alkol", ad: sz.alkol });
    if (u.pork) r.push({ tur: "domuz", ad: sz.domuz });
    return r;
  };

  /** Ürün satırının altındaki küçük bilgiler: kalori · porsiyon · gram. */
  Motor.prototype.olculer = function (u) {
    var sz = this.sz(), p = [];
    if (u.kcal) p.push(String(u.kcal));
    if (u.grams) p.push(String(u.grams));
    /* Sayı vermiyoruz ("4 porsiyon" kartta gereksiz duruyordu); yalnızca
       birden çok porsiyon olduğunu belirtiyoruz. */
    if (u.portions && u.portions.length > 1) p.push(sz.porsiyonlar);
    return p;
  };

  /* ------------------------------------------------------- ürün detayı */

  /**
   * RESTORAN BİLGİ KARTI: premium menüdeki kartın aynısı: saat, telefon,
   * adres, yol tarifi, sosyal hesaplar, Google puanı/değerlendirme ve dil.
   * Başlıktaki "Bilgi" düğmesi ya da işletme adı/logosu açar; ürün
   * detayıyla aynı katmanı kullanır (aşağı çekince, geri tuşuyla kapanır).
   * Veride olmayan satır hiç çizilmez.
   */
  Motor.prototype.bilgiHtml = function () {
    var i = this.isletme, sz = this.sz(), s = [];
    var satir = function (ikon, ad, deger) {
      return '<div class="bl-satir">' + ikon + '<span class="bl-ad">' + kacir(ad) + '</span>' +
        '<span class="bl-deger">' + deger + '</span></div>';
    };
    var bag = function (href, ikon, ad, deger, disari) {
      return '<a class="bl-satir" href="' + kacir(href) + '"' + (disari ? ' target="_blank" rel="noopener"' : "") + '>' +
        ikon + '<span class="bl-ad">' + kacir(ad) + '</span><span class="bl-deger">' + (deger || IKON.ok) + '</span></a>';
    };

    if (i.hours) {
      var durum = i.isOpen === false ? sz.kapali : i.isOpen === true ? sz.acik : "";
      s.push(satir(IKON.saat, sz.saat,
        (durum ? '<span class="bl-durum' + (i.isOpen === false ? " bl-durum--kapali" : "") + '">' + kacir(durum) + '</span> ' : "") +
        '<bdi dir="ltr">' + kacir(i.hours) + '</bdi>'));
    }
    if (i.phone) s.push(bag("tel:" + String(i.phone).replace(/\s/g, ""), IKON.telefon, sz.telefon, '<bdi dir="ltr">' + kacir(i.phone) + '</bdi>'));
    var yer = [i.district, i.city].filter(Boolean).join(", ");
    if (i.address || yer) s.push(satir(IKON.konum, sz.adres, kacir(i.address || yer)));
    if (i.maps) s.push(bag(i.maps, IKON.yol, sz.yol, "", true));
    if (i.instagram) s.push(bag(i.instagram, IKON.instagram, "Instagram", "", true));
    if (i.facebook) s.push(bag(i.facebook, IKON.facebook, "Facebook", "", true));
    if (i.tiktok) s.push(bag(i.tiktok, IKON.tiktok, "TikTok", "", true));
    /* Puan yalnızca gerçekten varsa: "0.0" kötü bir puan gibi okunuyor. */
    var puan = Number(i.rating) || 0, adet = Number(i.reviews) || 0;
    if (puan > 0) {
      var yuv = Math.max(0, Math.min(5, Math.round(puan)));
      s.push(satir(IKON.yildiz, sz.puan,
        '<span class="bl-yildiz" aria-hidden="true">' + new Array(yuv + 1).join("★") + new Array(6 - yuv).join("☆") + '</span> ' +
        puan.toFixed(1) + (adet ? ' · ' + adet + " " + kacir(sz.yorum) : "")));
    }
    if (i.googleReview) s.push(bag(i.googleReview, IKON.yildiz, sz.googleDeg, "", true));
    /* Dil: satırın üstüne serilmiş görünmez yerel seçici, dokununca
       telefonun kendi seçim listesi açılır. */
    if (this.diller.length > 1) {
      var d = this.durum.dil;
      s.push('<label class="bl-satir bl-satir--dil">' + IKON.dunya +
        '<span class="bl-ad">' + kacir(sz.dil) + '</span>' +
        '<span class="bl-deger">' + kacir(DIL_ADI[d] || d) + IKON.ok + '</span>' +
        '<select data-dil aria-label="' + kacir(sz.dil) + '">' + this.diller.map(function (k) {
          return '<option value="' + k + '"' + (k === d ? " selected" : "") + '>' + kacir(DIL_ADI[k] || k) + '</option>';
        }).join("") + '</select></label>');
    }

    /*
     * GIDA DENETİMİ: işletmenin panelde girdiği bağlantı (restaurant.
     * denetimLink). Bakanlığın karekodunda web adresi yok, yalnızca kayıt
     * numarası var; okutma Tarım Cebimde uygulamasıyla. Her işletmenin
     * denetimini doğrudan açan resmi bir adres de yok, o yüzden hedefi
     * işletme belirler. Alan boşsa bölüm hiç çizilmez.
     */
    var denetim = i.denetimLink
      ? '<div class="bl-bolum"><h4>' + kacir(sz.denetim) + '</h4>' +
          bag(i.denetimLink, IKON.belge, sz.denetimBag, IKON.disari, true) +
        '</div>'
      : "";

    return '<div class="dt-kutu dt-kutu--yazi dt-kutu--bilgi" role="dialog" aria-modal="true" tabindex="-1" aria-label="' + kacir(sz.bilgi) + '">' +
      '<div class="dt-tutamac" data-tutamac aria-hidden="true"><span></span></div>' +
      '<button class="dt-kapat" type="button" data-kapat aria-label="' + kacir(sz.kapat) + '">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
      '</button>' +
      '<div class="dt-kaydir"><div class="dt-govde">' +
        '<div class="bl-ust">' +
          (i.logo ? '<span class="bl-logo' + (i.logoLight ? " bl-logo--acik" : "") + '"><img src="' + kacir(i.logo) + '" alt=""></span>' : "") +
          '<div class="bl-kimlik"><h3>' + kacir(i.name || "") + '</h3><p>' + kacir(sz.bilgi) + '</p></div>' +
        '</div>' +
        '<div class="bl-liste">' + s.join("") + '</div>' +
        denetim +
        '<p class="bl-yasal">' + kacir(sz.yasalNot) + '</p>' +
      '</div></div></div>';
  };

  Motor.prototype.detayHtml = function (u) {
    var sz = this.sz(), t = this.metin(u), self = this;
    /* Detay görseli lazy OLMAMALI: kutu zaten açıldığı an görünür alandadır,
       lazy bırakılırsa açılışta bir kare boş görünüyordu. */
    var gorsel = u.image
      ? '<div class="dt-gorsel"><img src="' + kacir(u.image) + '" alt="' + kacir(t.ad) + '" loading="eager" decoding="async"></div>'
      : "";

    var porsiyon = "";
    if (u.portions && u.portions.length) {
      porsiyon = '<div class="dt-blok"><h4>' + kacir(sz.porsiyon) + '</h4><table class="dt-porsiyon">' +
        u.portions.map(function (p) {
          var ad = p.name || ((p.n || 1) + " " + sz.kisi);
          var olcu = [p.grams, p.kcal].filter(Boolean).join(" · ");
          return '<tr><th scope="row">' + kacir(ad) + '</th>' +
                 '<td class="dt-olcu">' + kacir(olcu) + '</td>' +
                 '<td class="dt-fiyat">' + kacir(paraTL(p.price)) + '</td></tr>';
        }).join("") + '</table></div>';
    }

    /* Yönetmeliğin Türkiye'ye özgü iki beyanı: alkol ve domuz kaynaklı
       bileşen. Alerjenlerden ayrı, kendi satırlarında ve açıkça yazılır. */
    var yasal = [];
    if (u.alcohol) yasal.push('<p class="dt-uyari">' + kacir(sz.alkolIcerir) + '</p>');
    if (u.pork) yasal.push('<p class="dt-uyari">' + kacir(sz.domuzIcerir) + '</p>');
    var icerikBlok = yasal.length ? '<div class="dt-blok"><h4>' + kacir(sz.icerik) + '</h4>' + yasal.join("") + '</div>' : "";

    var alerjen = "";
    var icerir = (u.allergens || []).map(function (a) { return self.alerjenAdi(a); });
    var olabilir = (u.possible || []).map(function (a) { return self.alerjenAdi(a); });
    if (icerir.length || olabilir.length) {
      alerjen = '<div class="dt-blok"><h4>' + kacir(sz.alerjen) + '</h4><div class="dt-alerjen">' +
        (icerir.length ? '<p><strong>' + kacir(sz.icerir) + ':</strong> ' + kacir(icerir.join(", ")) + '</p>' : "") +
        (olabilir.length ? '<p class="dt-olabilir"><strong>' + kacir(sz.olabilir) + ':</strong> ' + kacir(olabilir.join(", ")) + '</p>' : "") +
        '</div></div>';
    }

    var kcal = u.kcal ? '<div class="dt-blok dt-satir"><h4>' + kacir(sz.kalori) + '</h4><span>' + kacir(u.kcal) + '</span></div>' : "";
    var rozet = this.rozetler(u).map(function (r) {
      return '<span class="rozet rozet--' + r.tur + '">' + kacir(r.ad) + '</span>';
    }).join("");

    return '<div class="dt-kutu' + (gorsel ? "" : " dt-kutu--yazi") + '" role="dialog" aria-modal="true" tabindex="-1" aria-label="' + kacir(t.ad) + '">' +
      '<div class="dt-tutamac" data-tutamac aria-hidden="true"><span></span></div>' +
      '<button class="dt-kapat" type="button" data-kapat aria-label="' + kacir(sz.kapat) + '">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
      '</button>' +
      /* Kaydırma bu iç katmanda: kutu sabit kaldığı için yukarıdaki tutamaç
         ve kapatma düğmesi içerikle birlikte kayıp gitmiyor. */
      '<div class="dt-kaydir">' + gorsel +
      '<div class="dt-govde">' +
        (rozet ? '<div class="rozetler">' + rozet + '</div>' : "") +
        '<div class="dt-ust"><h3>' + kacir(t.ad) + '</h3><span class="dt-tutar">' + kacir(fiyatMetni(u, sz)) + '</span></div>' +
        (t.desc ? '<p class="dt-aciklama">' + kacir(t.desc) + '</p>' : "") +
        porsiyon + kcal + icerikBlok + alerjen +
      '</div></div></div>';
  };

  /* ------------------------------------------------------ filtre paneli */

  Motor.prototype.filtreHtml = function () {
    var sz = this.sz(), self = this;
    var kullanilan = this.alerjenler.filter(function (a) { return (a.declaredOn || 0) + (a.possibleOn || 0) > 0; });
    /* Menüde gerçekten alkollü / domuz bileşenli ürün varsa süzgeçte de
       seçenek olur. */
    var urunler = [];
    this.kategoriler.forEach(function (k) { urunler = urunler.concat(k.products || []); });
    if (urunler.some(function (u) { return u.alcohol; })) kullanilan = kullanilan.concat([{ key: "@alkol" }]);
    if (urunler.some(function (u) { return u.pork; })) kullanilan = kullanilan.concat([{ key: "@domuz" }]);
    if (!kullanilan.length) return "";
    return '<div class="filtre' + (this.durum.filtrePaneli ? " filtre--acik" : "") + '" id="filtrePaneli">' +
      '<div class="filtre-ust"><strong>' + kacir(sz.filtre) + '</strong>' +
        '<button type="button" data-filtre-temizle class="bag">' + kacir(sz.temizle) + '</button></div>' +
      '<div class="filtre-liste">' + kullanilan.map(function (a) {
        var secili = self.durum.gizli.indexOf(a.key) >= 0;
        return '<label class="filtre-oge' + (secili ? " secili" : "") + '">' +
          '<input type="checkbox" data-alerjen="' + kacir(a.key) + '"' + (secili ? " checked" : "") + '>' +
          '<span>' + kacir(self.alerjenAdi(a.key)) + '</span></label>';
      }).join("") + '</div></div>';
  };

  /* ------------------------------------------------------- dil seçici */

  Motor.prototype.dilHtml = function () {
    if (this.diller.length < 2) return "";
    var d = this.durum.dil, sz = this.sz();
    return '<div class="dil"><label class="gizli-etiket" for="dilSec">' + kacir(sz.dil) + '</label>' +
      '<select id="dilSec" data-dil>' + this.diller.map(function (k) {
        return '<option value="' + k + '"' + (k === d ? " selected" : "") + '>' + kacir(DIL_ADI[k] || k) + '</option>';
      }).join("") + '</select></div>';
  };

  /* ------------------------------------------------------ karşılama */

  Motor.prototype.girisHtml = function () {
    var w = this.isletme.welcome || {}, sz = this.sz();
    var ortu = w.overlay || {};
    var kaynak = w.media === "@welcome" ? "medya/welcome.mp4" : w.media;
    var arka = "";
    if (kaynak && w.kind === "video") {
      arka = '<video class="giris-medya" autoplay muted loop playsinline preload="auto" poster="' +
             kacir(this.isletme.cover || "") + '"><source src="' + kacir(kaynak) + '" type="video/mp4"></video>';
    } else if (kaynak) {
      arka = '<img class="giris-medya" src="' + kacir(kaynak) + '" alt="">';
    } else if (this.isletme.cover) {
      arka = '<img class="giris-medya" src="' + kacir(this.isletme.cover) + '" alt="">';
    }
    var yon = ortu.gradient === "bottom" ? "to top" : ortu.gradient === "top" ? "to bottom" : null;
    var op = (ortu.opacity == null ? 55 : ortu.opacity) / 100;
    var renk = ortu.color || "#000000";
    var perde = yon
      ? "linear-gradient(" + yon + ", " + renk + ikiHane(Math.round(op * 255).toString(16)) + ", transparent 78%)"
      : renk;
    var logo = w.logo || this.isletme.logo;
    var boy = Math.min(320, w.logoSize || 220);

    return '<div class="giris" id="girisEkrani">' + arka +
      '<div class="giris-perde" style="background:' + kacir(perde) + ';' + (yon ? "" : "opacity:" + op + ";") + '"></div>' +
      '<div class="giris-ic">' +
        (logo ? '<img class="giris-logo" src="' + kacir(logo) + '" alt="' + kacir(this.isletme.name || "") + '" style="max-width:' + boy + 'px">'
              : '<h1 class="giris-ad">' + kacir(this.isletme.name || "") + '</h1>') +
        '<button class="giris-dugme" type="button" data-giris-kapat>' + kacir(w.buttonText || sz.menu) + '</button>' +
      '</div></div>';
  };

  /* ---------------------------------------------------------- çizim */

  Motor.prototype.ciz = function () {
    var self = this, sz = this.sz(), ctx = this.baglam();
    var govde = [];

    var bosMu = true;
    for (var i = 0; i < this.kategoriler.length; i++) {
      var kat = this.kategoriler[i];
      var bloklar = this.altlaraBol(kat);
      if (!bloklar.length) continue;
      bosMu = false;
      var ic = bloklar.map(function (b) {
        return (b.ad ? self.skin.altBaslik(b.ad, ctx) : "") +
          '<div class="urunler">' + b.urunler.map(function (u) { return self.skin.urun(u, ctx); }).join("") + '</div>';
      }).join("");
      govde.push(this.skin.bolum(kat, ic, ctx));
    }
    if (bosMu) govde.push('<p class="bos">' + kacir(sz.sonucYok) + '</p>');

    var html =
      (this.durum.giris ? this.girisHtml() : "") +
      '<div class="sayfa"' + (this.durum.giris ? ' inert aria-hidden="true"' : "") + '>' +
        this.skin.ustBaslik(ctx) +
        /*
         * Arama, filtre paneli ve kategori çubuğu TEK yapışkan blokta.
         * Eskiden arama çubuğu başlığın (header) içinde sticky'ydi; sticky
         * bir öğe ebeveyninin dışına çıkamadığı için başlık kaydırılıp
         * geçilince arama da onunla gidiyordu, kategori çubuğu ise sabit
         * `top` değeriyle boşlukta asılı kalıyordu. Filtre paneli de akışın
         * içindeydi: aşağıdayken açılınca sayfanın tepesinde, görünmeden
         * açılıyordu.
         */
        '<div class="yapiskan" data-yapiskan>' +
          '<div class="arama-cubugu">' + ctx.aramaHtml() + ctx.filtreDugmesi() + '</div>' +
          this.filtreHtml() +
          this.skin.kategoriCubugu(ctx) +
        '</div>' +
        '<main class="govde" id="govde">' + govde.join("") + '</main>' +
        this.skin.altBilgi(ctx) +
      '</div>';

    /* Detay kutusu bilerek bu HTML'in dışında: ürüne her tıklandığında bütün
       menüyü yeniden kurmak 100 kartı ve görsellerini baştan çizdiriyordu.
       Kutu kendi katmanında açılıp kapanır (bkz. detayAc / detayKapat). */
    this.kok.innerHTML = html;
    this.ortu = null;
    this.paletiUygula();
    this.yapiskanOlc();
    this.gozcuKur();
    /* Karşılama tam ekran dururken arkadaki menü parmakla kayabiliyordu;
       düğmeye basınca menü ortasında bir yerde açılıyordu. */
    if (this.durum.giris) this.kaydirmaKilidi(true);
    else if (!this.katmanAcik()) this.kaydirmaKilidi(false);
    this.gorselKancasi();
    /* Karşılama açıkken menü arkada duruyor; ilk ekranı şimdiden hazırla. */
    if (this.durum.giris) this.gorselleriOnHazirla(14);
    if (this.katmanAcik()) this.detayCiz();
  };

  /**
   * Arama ve alerjen filtresi yalnızca listeyi değiştirir; başlığı, arama
   * kutusunu ve karşılamayı yeniden kurmaya gerek yok. Tam ciz() çağırmak
   * her tuş vuruşunda odağı ve klavyeyi zıplatıyordu.
   */
  Motor.prototype.yenile = function () {
    var self = this, ctx = this.baglam(), sz = this.sz();
    var govde = this.kok.querySelector("#govde");
    if (!govde) { this.ciz(); return; }

    var parcalar = [], bosMu = true;
    for (var i = 0; i < this.kategoriler.length; i++) {
      var kat = this.kategoriler[i];
      var bloklar = this.altlaraBol(kat);
      if (!bloklar.length) continue;
      bosMu = false;
      var ic = bloklar.map(function (b) {
        return (b.ad ? self.skin.altBaslik(b.ad, ctx) : "") +
          '<div class="urunler">' + b.urunler.map(function (u) { return self.skin.urun(u, ctx); }).join("") + '</div>';
      }).join("");
      parcalar.push(this.skin.bolum(kat, ic, ctx));
    }
    if (bosMu) parcalar.push('<p class="bos">' + kacir(sz.sonucYok) + '</p>');
    govde.innerHTML = parcalar.join("");

    /* Yeni liste kısa bir yükselişle gelsin; sınıf animasyon bitince kalkar
       ki sonraki yenilemede baştan oynayabilsin. */
    govde.classList.remove("govde--yeni");
    void govde.offsetWidth;
    govde.classList.add("govde--yeni");
    clearTimeout(this.listeZaman);
    this.listeZaman = setTimeout(function () { govde.classList.remove("govde--yeni"); }, 400);


    /* Kategori çubuğu da süzgece uyar (boşalan kategoriler düşer). */
    var eskiCubuk = this.kok.querySelector("[data-kategori-cubugu]");
    if (eskiCubuk) {
      var yeniCubuk = this.skin.kategoriCubugu(ctx);
      if (yeniCubuk) {
        var kap = document.createElement("div");
        kap.innerHTML = yeniCubuk;
        if (kap.firstElementChild) eskiCubuk.replaceWith(kap.firstElementChild);
      }
    }

    /* Filtre düğmesindeki sayaç. */
    var dugme = this.kok.querySelector("[data-filtre-ac]");
    if (dugme) {
      var kapsul = document.createElement("div");
      kapsul.innerHTML = ctx.filtreDugmesi();
      if (kapsul.firstElementChild) dugme.replaceWith(kapsul.firstElementChild);
    }

    this.gozcuKur();
  };

  /** Deriye geçen bağlam: veri + yardımcılar (deri mantık yazmaz). */
  Motor.prototype.baglam = function () {
    var self = this;
    return {
      isletme: this.isletme, durum: this.durum, sz: this.sz(), diller: this.diller,
      kacir: kacir, paraTL: paraTL,
      fiyat: function (u) { return fiyatMetni(u, self.sz()); },
      metin: function (n) { return self.metin(n); },
      rozetler: function (u) { return self.rozetler(u); },
      olculer: function (u) { return self.olculer(u); },
      dilHtml: function () { return self.dilHtml(); },
      /* Başlıktaki "Bilgi" düğmesi: restoran bilgi kartını açar. */
      bilgiDugmesi: function () {
        var sz = self.sz();
        return '<button type="button" class="bilgi-dugme" data-bilgi-ac aria-haspopup="dialog" aria-label="' + kacir(sz.bilgi) + '">' +
          IKON.bilgi + '<span>' + kacir(sz.bilgiKisa) + '</span></button>';
      },
      /* Altbilgi imzası, dört temada da aynı. */
      imza: function () {
        return '<span class="imza">' +
          '<a href="https://cepte.menu" target="_blank" rel="noopener">cepte.menu</a>' +
          ' tarafından geliştirilmiştir</span>';
      },
      aramaHtml: function () {
        return '<label class="gizli-etiket" for="searchInput">' + kacir(self.sz().ara) + '</label>' +
          '<input id="searchInput" type="search" autocomplete="off" placeholder="' + kacir(self.sz().ara) + '" value="' + kacir(self.durum.arama) + '">';
      },
      filtreDugmesi: function () {
        var acik = self.durum.gizli.length;
        return '<button class="filtre-dugme' + (acik ? " etkin" : "") + '" type="button" data-filtre-ac aria-label="' + kacir(self.sz().filtre) + '">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>' +
          (acik ? '<span class="filtre-sayi">' + acik + '</span>' : "") + '</button>';
      },
      /** Süzgeçlerden sonra kategoride görünen ürün sayısı. */
      gorunurSayi: function (kat) {
        return self.altlaraBol(kat).reduce(function (t, b) { return t + b.urunler.length; }, 0);
      },
      kategoriler: function () {
        return self.kategoriler.filter(function (k) { return self.altlaraBol(k).length; })
          .map(function (k) { return { id: k.id, ad: self.metin(k).ad, mood: k.mood || "", image: k.image || "" }; });
      }
    };
  };

  /* --------------------------------------------------- detay katmanı */

  /**
   * Sayfa kaydırmasını kilitler. iOS Safari'de body'ye overflow:hidden
   * vermek yetmez, sayfa yine kayar, bu yüzden gövdeyi bulunduğu yerde
   * sabitleyip kapanışta tam olarak aynı yere döndürüyoruz.
   */
  Motor.prototype.kaydirmaKilidi = function (kilitle) {
    var g = document.body;
    if (kilitle) {
      if (this.kilitliY != null) return;
      this.kilitliY = window.scrollY || window.pageYOffset || 0;
      /* Kilitlenince dikey kaydırma çubuğu kaybolur ve sayfa onun genişliği
         kadar yana zıplar, kutu açılışında menü "yenileniyormuş" gibi
         görünüyordu. Kaybolan genişlik kadar boşluk bırakıyoruz. */
      var telafi = window.innerWidth - document.documentElement.clientWidth;
      g.style.position = "fixed";
      g.style.top = -this.kilitliY + "px";
      g.style.insetInline = "0";
      g.style.width = "100%";
      if (telafi > 0) g.style.paddingInlineEnd = telafi + "px";
    } else {
      if (this.kilitliY == null) return;
      var y = this.kilitliY;
      this.kilitliY = null;
      g.style.position = "";
      g.style.top = "";
      g.style.insetInline = "";
      g.style.width = "";
      g.style.paddingInlineEnd = "";
      var eskiDavranis = document.documentElement.style.scrollBehavior;
      document.documentElement.style.scrollBehavior = "auto";
      window.scrollTo(0, y);
      document.documentElement.style.scrollBehavior = eskiDavranis;
    }
  };

  /** Açık katman var mı: ürün detayı ya da bilgi kartı. */
  Motor.prototype.katmanAcik = function () { return !!(this.durum.acikUrun || this.durum.bilgi); };

  /** Açık ürünü (ya da bilgi kartını) kendi katmanında çizer; menünün DOM'una dokunmaz. */
  Motor.prototype.detayCiz = function () {
    var u = this.durum.acikUrun;
    if (u) this.katmanAc(this.detayHtml(u));
    else if (this.durum.bilgi) this.katmanAc(this.bilgiHtml());
  };

  Motor.prototype.katmanAc = function (icerik) {
    var self = this;
    var ortu = document.createElement("div");
    ortu.className = "dt-ortu";
    ortu.setAttribute("data-kapat-ortu", "");
    ortu.innerHTML = '<div class="dt-perde"></div>' + icerik;
    this.kok.appendChild(ortu);
    this.ortu = ortu;

    var kutu = ortu.querySelector(".dt-kutu");
    this.perde = ortu.querySelector(".dt-perde");
    this.kaydirmaKilidi(true);

    /* Arka plan klavyeye ve ekran okuyucuya kapansın. */
    var sayfa = this.kok.querySelector(".sayfa");
    if (sayfa) { sayfa.setAttribute("inert", ""); sayfa.setAttribute("aria-hidden", "true"); }

    /*
     * Açılış geçişinin oynaması için tarayıcının önce BAŞLANGIÇ değerini
     * hesaplaması gerekir. requestAnimationFrame kullanılmıyor: sekme arka
     * plandayken rAF duraklıyor ve kutu açılmadan kilitli kalıyordu.
     * Yerine düzeni senkron okuyup (reflow) sınıfı hemen veriyoruz.
     */
    if (kutu) {
      void kutu.getBoundingClientRect().height;
      kutu.classList.add("acildi");
    }

    if (kutu && kutu.focus) kutu.focus({ preventScroll: true });
    this.suruklemeyiBagla(kutu, ortu);

    /*
     * Telefonda bir katmani kapatmanin en dogal yolu geri tusu/jesti.
     * Gecmise bir giris eklenir; geri basilinca kutu kapanir, menuden
     * cikilmaz.
     */
    if (window.history && history.pushState && !this.gecmisEkledi) {
      try {
        history.pushState({ cmDetay: 1 }, "");
        this.gecmisEkledi = true;
      } catch (hata) { /* yoksay */ }
    }
  };

  /**
   * Kutuyu kapatır. `kaydirarak` true ise kutu parmağın bıraktığı yerden
   * aşağı süzülür; değilse normal kapanış animasyonu oynar.
   */
  Motor.prototype.detayKapat = function (kaydirarak, gecmistenGeldi) {
    var self = this, ortu = this.ortu;
    this.durum.acikUrun = null;
    this.durum.bilgi = false;

    /* Kutu dugmeyle/jestle kapandiysa gecmisteki girisi de geri al ki
       geri tusu kullaniciyi bir onceki sayfaya atmasin. */
    if (this.gecmisEkledi && !gecmistenGeldi) {
      this.gecmisEkledi = false;
      try { history.back(); } catch (hata) { /* yoksay */ }
    }
    this.gecmisEkledi = false;

    if (!ortu) return;
    this.ortu = null;

    var kutu = ortu.querySelector(".dt-kutu");
    ortu.classList.add("kapanir");
    if (kutu) {
      kutu.classList.remove("suruklenir");
      kutu.style.transform = "translateY(" + (kaydirarak ? "100%" : "18px") + ")";
      kutu.style.opacity = kaydirarak ? "1" : "0";
      kutu.classList.remove("acildi");
    }

    var bitir = function () {
      if (ortu.parentNode) ortu.parentNode.removeChild(ortu);
      self.kaydirmaKilidi(false);
      var sayfa = self.kok.querySelector(".sayfa");
      if (sayfa && !self.durum.giris) { sayfa.removeAttribute("inert"); sayfa.removeAttribute("aria-hidden"); }
      /* Odak, kutuyu açan kartın üstüne geri dönsün. */
      var geri = self.sonTetikleyici;
      self.sonTetikleyici = null;
      if (geri && document.contains(geri) && geri.focus) geri.focus({ preventScroll: true });
    };

    var sure = 220;
    var bitti = false;
    var kapat = function () { if (bitti) return; bitti = true; bitir(); };
    if (kutu) kutu.addEventListener("transitionend", kapat, { once: true });
    setTimeout(kapat, sure + 60);   /* transitionend gelmezse yine de temizle */
  };

  /**
   * Kutuyu aşağı çekerek kapatma. Telefonda kapatma düğmesi ekranın
   * tepesinde kalıyor, başparmakla zor erişiliyor.
   *
   * Sürükleme yalnızca kutunun içeriği en üstteyken (ya da tutamaçtan
   * başlayınca) devreye girer, yoksa porsiyon tablosunu okurken kutu
   * kapanırdı.
   *
   * Dokunmatik ve fare AYRI ele alınır. Daha önce ikisi de Pointer Events
   * üzerinden yürüyordu; dokunmatikte `touchmove`'da preventDefault çağırmak
   * tarayıcının o dokunuş için `pointercancel` göndermesine yol açıyor,
   * bizim iptal işleyicimiz de jesti öldürüyordu. Sonuç: telefonda ne
   * kapatma jesti çalışıyordu ne de kutunun kendi kaydırması.
   */
  Motor.prototype.suruklemeyiBagla = function (kutu, ortu) {
    if (!kutu) return;
    var self = this;
    /* Kaydırma kutunun kendisinde değil iç katmanda. */
    var kaydir = kutu.querySelector(".dt-kaydir") || kutu;
    var perde = ortu.querySelector(".dt-perde");

    var basY = 0, basX = 0, basScroll = 0, dy = 0;
    var aktif = false, karar = false, yon = "", tutamactan = false;
    var sonY = 0, sonZaman = 0, hiz = 0;

    /* Yön kararı için eşik. */
    var ESIK = 8;
    /* iOS'ta esnek kaydırmadan sonra scrollTop tam 0'a oturmayabiliyor. */
    var UST_PAYI = 2;

    function ustteMi() { return kaydir.scrollTop <= UST_PAYI; }

    function ustSinifi() {
      if (ustteMi()) kaydir.classList.add("dt-kaydir--ustte");
      else kaydir.classList.remove("dt-kaydir--ustte");
    }
    ustSinifi();
    kaydir.addEventListener("scroll", ustSinifi, { passive: true });

    function kareyeYaz() {
      kutu.style.transform = "translateY(" + dy + "px)";
      if (perde) perde.style.opacity = String(1 - Math.min(1, dy / 320));
    }

    /* ---------------------------------------------------- jest çekirdeği */

    function baslat(x, y, hedef) {
      if (hedef && hedef.closest && hedef.closest("[data-kapat]")) return false;
      tutamactan = !!(hedef && hedef.closest && hedef.closest("[data-tutamac]"));
      ustSinifi();
      /* İçerik aşağı kaydırılmışsa gövdeden çekmek kapatma değil okumadır. */
      if (!tutamactan && !ustteMi()) return false;

      aktif = true; karar = false; yon = ""; dy = 0; hiz = 0;
      basY = sonY = y; basX = x;
      basScroll = kaydir.scrollTop;
      sonZaman = Date.now();
      return true;
    }

    /** `frenle` true dönerse çağıran preventDefault etmeli. */
    function hareket(x, y) {
      if (!aktif) return false;
      var fark = y - basY;

      if (!karar) {
        var yatay = Math.abs(x - basX);
        if (Math.abs(fark) < ESIK) {
          /* Parmağını basılı tutan elin birkaç piksel yana kayması olağan;
             jesti burada öldürmüyoruz. Yalnızca apaçık bir yana kaydırma
             bırakılır. */
          if (yatay > 34 && yatay > Math.abs(fark) * 2) aktif = false;
          return false;
        }

        karar = true;
        yon = fark > 0 ? "asagi" : "yukari";
        /* Sürükleme parmağın o anki yerinden başlasın; kutu eşik kadar
           zıplamasın. */
        basY = sonY = y;
        sonZaman = Date.now();
        fark = 0; hiz = 0;

        if (yon === "asagi") {
          kutu.classList.add("suruklenir");
          var secim = window.getSelection && window.getSelection();
          if (secim && secim.removeAllRanges) secim.removeAllRanges();
        }
      }

      if (yon === "yukari") {
        /* En üstteyken tarayıcının kaydırması kapalı (touch-action: none),
           o yüzden yukarı kaydırmayı da biz uygularız. İçerik bir kez
           kayınca sınıf kalkar ve sonraki jestler normal, momentumlu
           kaydırmaya döner. */
        kaydir.scrollTop = basScroll - fark;
        return true;
      }

      var simdi = Date.now(), gecen = simdi - sonZaman;
      if (gecen > 0) {
        var anlik = (y - sonY) / gecen;
        hiz = hiz * 0.6 + anlik * 0.4;      /* yumuşatılmış ortalama */
        sonY = y; sonZaman = simdi;
      }

      dy = Math.max(0, fark);
      kareyeYaz();
      return true;
    }

    function bitir() {
      if (!aktif) return;
      aktif = false;
      var suruklendi = karar && yon === "asagi";
      karar = false; yon = "";
      ustSinifi();
      if (!suruklendi) return;

      kutu.classList.remove("suruklenir");

      /* Eşik ekrana göre: küçük telefonda 48, büyük kutuda 90 piksel. */
      var mesafeEsigi = Math.max(48, Math.min(90, kutu.clientHeight * 0.12));
      if (dy > mesafeEsigi || hiz > 0.35) {
        self.detayKapat(true);
      } else {
        kutu.style.transform = "";
        if (perde) perde.style.opacity = "";
      }
      dy = 0; hiz = 0;
    }

    function iptal() {
      if (aktif && karar && yon === "asagi") {
        kutu.style.transform = "";
        if (perde) perde.style.opacity = "";
      }
      aktif = false; karar = false; yon = ""; dy = 0; hiz = 0;
      kutu.classList.remove("suruklenir");
      ustSinifi();
    }

    /* ------------------------------------------------------- dokunmatik */

    kutu.addEventListener("touchstart", function (e) {
      if (e.touches.length !== 1) { iptal(); return; }
      baslat(e.touches[0].clientX, e.touches[0].clientY, e.target);
    }, { passive: true });

    kutu.addEventListener("touchmove", function (e) {
      if (!aktif) return;
      if (e.touches.length !== 1) { iptal(); return; }
      var t = e.touches[0];
      /* Kendi işimizi yaptıysak sayfanın da kaymasını engelliyoruz.
         iOS bu freni yalnızca touchmove'da tanıyor. */
      if (hareket(t.clientX, t.clientY) && e.cancelable) e.preventDefault();
    }, { passive: false });

    kutu.addEventListener("touchend", function () { bitir(); });
    kutu.addEventListener("touchcancel", function () { iptal(); });

    /* ------------------------------------------------------- fare, kalem */

    if (window.PointerEvent) {
      kutu.addEventListener("pointerdown", function (e) {
        if (e.pointerType === "touch") return;      /* dokunmatik yukarıda */
        if (e.button != null && e.button !== 0) return;
        if (baslat(e.clientX, e.clientY, e.target) && kutu.setPointerCapture) {
          try { kutu.setPointerCapture(e.pointerId); } catch (hata) { /* yoksay */ }
        }
      });

      kutu.addEventListener("pointermove", function (e) {
        if (e.pointerType === "touch" || !aktif) return;
        if (hareket(e.clientX, e.clientY) && e.cancelable) e.preventDefault();
      }, { passive: false });

      kutu.addEventListener("pointerup", function (e) {
        if (e.pointerType === "touch") return;
        if (e.pointerId != null && kutu.hasPointerCapture && kutu.hasPointerCapture(e.pointerId)) {
          try { kutu.releasePointerCapture(e.pointerId); } catch (hata) { /* yoksay */ }
        }
        bitir();
      });

      kutu.addEventListener("pointercancel", function (e) {
        if (e.pointerType === "touch") return;      /* dokunmatikte touchcancel var */
        iptal();
      });
    }
  };

  /* -------------------------------------------------------- olaylar */

  /**
   * Yapışkan bloğun yüksekliğini --yapiskan-h olarak yazar. Bölümlerin
   * kaydırma payı ve Liste'nin yapışkan bölüm başlığı buna göre hizalanır.
   * Eskiden bu değerler temalarda sabit piksel yazılıydı; filtre paneli
   * açılınca ya da yazı tipi yüklenince tutmuyor, kategori başlığı çubuğun
   * altında kalıyordu.
   */
  Motor.prototype.yapiskanOlc = function () {
    var self = this;
    var el = this.kok.querySelector("[data-yapiskan]");
    if (!el) return;
    var olc = function () {
      var h = Math.round(el.getBoundingClientRect().height);
      if (!h || h === self.yapiskanH) return;
      var onceki = self.yapiskanH;
      self.yapiskanH = h;
      document.documentElement.style.setProperty("--yapiskan-h", h + "px");
      /* Gözcünün üst payı da yüksekliğe bağlı; belirgin değişimde yenile. */
      if (onceki != null && Math.abs(h - onceki) > 6) self.gozcuKur();
    };
    olc();
    if (this.yapiskanGozcu) this.yapiskanGozcu.disconnect();
    if ("ResizeObserver" in window) {
      this.yapiskanGozcu = new ResizeObserver(olc);
      this.yapiskanGozcu.observe(el);
    } else if (!this.yapiskanDinle) {
      this.yapiskanDinle = true;
      window.addEventListener("resize", function () { self.yapiskanOlc(); });
    }
  };

  Motor.prototype.gozcuKur = function () {
    var self = this;
    var cubuk = this.kok.querySelector("[data-kategori-cubugu]");
    if (!cubuk || !("IntersectionObserver" in window)) return;
    var bolumler = this.kok.querySelectorAll("[data-bolum]");
    if (!bolumler.length) return;
    if (this.gozcu) this.gozcu.disconnect();
    var ustPay = (this.yapiskanH || 88) + 8;
    this.gozcu = new IntersectionObserver(function (girdiler) {
      if (self.gozcuSus) return;
      girdiler.forEach(function (g) {
        if (!g.isIntersecting) return;
        var id = g.target.getAttribute("data-bolum");
        /* Çubuk süzgeçten sonra yeniden kurulabiliyor; o anki hâlini al. */
        cubuk = self.kok.querySelector("[data-kategori-cubugu]") || cubuk;
        var dugmeler = cubuk.querySelectorAll("[data-goto]");
        for (var i = 0; i < dugmeler.length; i++) {
          var etkin = dugmeler[i].getAttribute("data-goto") === id;
          dugmeler[i].classList.toggle("etkin", etkin);
          if (etkin) cubuguOrtala(cubuk, dugmeler[i]);
        }
      });
    }, { rootMargin: "-" + ustPay + "px 0px -70% 0px", threshold: 0 });
    for (var i = 0; i < bolumler.length; i++) this.gozcu.observe(bolumler[i]);
  };

  /**
   * Görseller yüklenince sönümlenerek girsin. Tek tek dinleyici bağlamak
   * yerine yakalama evresinde tek bir `load` dinleyicisi kullanılır,
   * lazy yüklenen yüzlerce görsel için de tek kanca yeter.
   *
   * Önbellekten gelen görseller olay üretmeden hazır olabildiği için
   * çizimden sonra bir de tamamlananlar taranır.
   */
  Motor.prototype.gorselKancasi = function () {
    var kok = this.kok;
    if (!kok || kok.__gorselKancasi) return;
    kok.__gorselKancasi = true;

    kok.addEventListener("load", function (e) {
      var el = e.target;
      if (!el || el.tagName !== "IMG" || el.__girdi) return;
      el.__girdi = true;
      el.classList.add("yeni-yuklendi");
      setTimeout(function () { el.classList.remove("yeni-yuklendi"); }, 420);
    }, true);

    /* Yüklenemeyen görsel kırık resim simgesi ve üstüne taşan alt metinle
       kartı bozuyordu (görsel sunucusu kapalıyken bütün menü böyle
       görünüyordu). Gizlenir; yerinde kartın sade görsel zemini kalır. */
    kok.addEventListener("error", function (e) {
      var el = e.target;
      if (el && el.tagName === "IMG") el.classList.add("gorsel-yok");
    }, true);
  };

  /**
   * Karşılama dururken ilk ekranın görsellerini sessizce hazırlar.
   * Kullanıcı düğmeye bastığında menü çoktan boyanmış olur; yoksa o anda
   * onlarca görsel birden inip çözülüyor ve ilk kare takılıyordu.
   */
  Motor.prototype.gorselleriOnHazirla = function (adet) {
    if (!this.kok) return;
    var g = this.kok.querySelectorAll(".urunler img, .kart-gorsel img, .satir-gorsel");
    var sinir = Math.min(adet || 12, g.length);
    for (var i = 0; i < sinir; i++) {
      var im = g[i];
      if (im.getAttribute("loading") === "lazy") im.setAttribute("loading", "eager");
      if (im.decode) { try { im.decode().catch(function () {}); } catch (hata) { /* yoksay */ } }
    }
  };

  /* #govde odaklanabilir değil; tabindex verilmeden focus() sessizce düşüyor
     ve klavye kullanıcısı sayfanın başına dönemiyordu. */
  Motor.prototype.govdeyeOdaklan = function () {
    var g = document.getElementById("govde");
    if (!g) return;
    g.setAttribute("tabindex", "-1");
    g.focus({ preventScroll: true });
  };

  Motor.prototype.urunBul = function (id) {
    for (var i = 0; i < this.kategoriler.length; i++) {
      var ps = this.kategoriler[i].products || [];
      for (var j = 0; j < ps.length; j++) if (ps[j].id === id) return ps[j];
    }
    return null;
  };

  Motor.prototype.olaylariBagla = function () {
    var self = this;

    this.kok.addEventListener("click", function (e) {
      var el = e.target;

      if (el.closest("[data-giris-kapat]")) {
        /*
         * Menü zaten karşılamanın ARKASINDA kurulu duruyor; yalnızca
         * karşılama katmanını söndürüp kaldırıyoruz.
         *
         * Eskiden burada ciz() çağrılıyordu: bütün DOM baştan kuruluyor,
         * yüz kart ve görsel yeniden oluşuyordu. Göz bunu "sayfa yenilendi"
         * diye okuyordu.
         */
        var giris = document.getElementById("girisEkrani");
        if (giris && !giris.classList.contains("cikiyor")) {
          giris.classList.add("cikiyor");
          self.durum.giris = false;

          var sayfa = self.kok.querySelector(".sayfa");
          if (sayfa) {
            sayfa.removeAttribute("inert");
            sayfa.removeAttribute("aria-hidden");
            /* Menüye BİLEREK animasyon verilmiyor: .sayfa binden fazla öğe
               taşıyor, hepsini birden canlandırmak telefonda takılma
               yapıyordu. Karşılamanın kendi sönüşü geçişi zaten anlatıyor. */
          }
          self.kaydirmaKilidi(false);

          setTimeout(function () {
            if (giris.parentNode) giris.parentNode.removeChild(giris);
            self.govdeyeOdaklan();
          }, 420);
          return;
        }
        self.durum.giris = false; self.ciz();
        self.govdeyeOdaklan();
        return;
      }
      var git = el.closest("[data-goto]");
      if (git) {
        var hedef = self.kok.querySelector('[data-bolum="' + git.getAttribute("data-goto") + '"]');
        if (hedef) {
          /* Yumuşak kaydırma sürerken gözcü aradan geçen her kategoriyi
             etkin işaretliyor, çubuk da onlara kayıyordu: varış noktasına
             kadar gözcüyü susturup hedefi hemen etkin yapıyoruz. */
          /* Uzun menüde yumuşak kaydırma bir saniyeyi aşabiliyor; sabit
             700 ms'lik susma yetmiyor, çubuk yolda titriyordu. Kaydırma
             bitince (scrollend) açılır; olayı tanımayan tarayıcıda kaydırma
             olayları 160 ms kesilince. */
          self.gozcuSus = true;
          clearTimeout(self.gozcuZaman);
          if (self.gozcuBitis) window.removeEventListener("scroll", self.gozcuBitis);
          var ac = function () {
            clearTimeout(self.gozcuZaman);
            window.removeEventListener("scroll", self.gozcuBitis);
            window.removeEventListener("scrollend", self.gozcuBitis);
            self.gozcuBitis = null;
            self.gozcuSus = false;
          };
          if ("onscrollend" in window) {
            self.gozcuBitis = ac;
            window.addEventListener("scrollend", ac, { once: true });
            self.gozcuZaman = setTimeout(ac, 4000);
          } else {
            self.gozcuBitis = function () {
              clearTimeout(self.gozcuZaman);
              self.gozcuZaman = setTimeout(ac, 160);
            };
            window.addEventListener("scroll", self.gozcuBitis, { passive: true });
            self.gozcuZaman = setTimeout(ac, 900);
          }
          var cubuk = self.kok.querySelector("[data-kategori-cubugu]");
          if (cubuk) {
            var hepsi = cubuk.querySelectorAll("[data-goto]");
            for (var i = 0; i < hepsi.length; i++) hepsi[i].classList.toggle("etkin", hepsi[i] === git);
            cubuguOrtala(cubuk, git);
          }
          hedef.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        return;
      }
      if (el.closest("[data-filtre-ac]")) {
        self.durum.filtrePaneli = !self.durum.filtrePaneli;
        var p = document.getElementById("filtrePaneli");
        if (p) p.classList.toggle("filtre--acik", self.durum.filtrePaneli);
        return;
      }
      if (el.closest("[data-filtre-temizle]")) {
        self.durum.gizli = []; self.yerelYaz();
        var kutular = self.kok.querySelectorAll("[data-alerjen]");
        for (var j = 0; j < kutular.length; j++) {
          kutular[j].checked = false;
          var etiket = kutular[j].closest(".filtre-oge");
          if (etiket) etiket.classList.remove("secili");
        }
        self.yenile();
        return;
      }
      if (el.closest("[data-kapat]") || (el.hasAttribute && el.hasAttribute("data-kapat-ortu"))) {
        if (self.katmanAcik()) self.detayKapat(false);
        return;
      }
      var bilgi = el.closest("[data-bilgi-ac]");
      if (bilgi) {
        if (self.katmanAcik()) self.detayKapat(false);
        self.sonTetikleyici = bilgi;
        self.durum.bilgi = true;
        self.detayCiz();
        return;
      }
      var urun = el.closest("[data-product]");
      if (urun) {
        var u = self.urunBul(urun.getAttribute("data-product"));
        if (u) {
          if (self.katmanAcik()) self.detayKapat(false);
          self.sonTetikleyici = urun;
          self.durum.acikUrun = u;
          self.detayCiz();
        }
      }
    });

    this.kok.addEventListener("change", function (e) {
      var el = e.target;
      if (el.hasAttribute("data-dil")) {
        /* Bilgi kartındaki seçiciden gelindiyse önce kart kapanır; menü
           yeni dilde baştan kurulur. */
        if (self.katmanAcik()) self.detayKapat(false);
        self.durum.dil = el.value; self.yerelYaz(); self.ciz(); return;
      }
      if (el.hasAttribute("data-alerjen")) {
        var a = el.getAttribute("data-alerjen"), i = self.durum.gizli.indexOf(a);
        if (el.checked) { if (i < 0) self.durum.gizli.push(a); } else if (i >= 0) self.durum.gizli.splice(i, 1);
        self.yerelYaz();
        var etiket2 = el.closest(".filtre-oge");
        if (etiket2) etiket2.classList.toggle("secili", el.checked);
        self.yenile();
      }
    });

    var zaman;
    this.kok.addEventListener("input", function (e) {
      if (e.target.id !== "searchInput") return;
      var deger = e.target.value;
      clearTimeout(zaman);
      zaman = setTimeout(function () {
        /* Yalnızca liste yenilenir: arama kutusu DOM'da kaldığı için odak da
           imleç de yerinde kalır, telefonda klavye kapanıp açılmaz. */
        self.durum.arama = deger;
        self.yenile();
      }, 180);
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && self.katmanAcik()) { self.detayKapat(false); }
    });

    /* Geri tusu/jesti: acik kutu varsa once onu kapatir. */
    window.addEventListener("popstate", function () {
      if (self.katmanAcik()) self.detayKapat(false, true);
    });
  };

  Motor.prototype.baslat = function (kokSecici) {
    this.kok = document.querySelector(kokSecici || "#menu");
    if (!this.kok) return;
    /*
     * Sönümlemeli görsel girişi yalnızca betik çalışıyorken açılır; sınıf
     * İLK ÇİZİMDEN ÖNCE veriliyor. Sonradan eklenince görseller bir de
     * görünürden saydama doğru geri sönüyor, yani onlarca gereksiz geçiş
     * başlıyordu.
     */
    document.documentElement.className += " js-hazir";
    this.ciz();
    this.olaylariBagla();
  };

  window.MenuMotor = Motor;
  window.MenuMotor.araclar = {
    kacir: kacir, paraTL: paraTL, hexHsl: hexHsl, vurguUstuMetin: vurguUstuMetin,
    kontrast: kontrast, renkRgb: renkRgb, zemineGoreYazi: zemineGoreYazi
  };
})();

/* KADRAJ: fotoğraf ağırlıklı. Büyük görselli kartlar, sıcak kağıt zemin. */
window.DERI = {
  ad: "kadraj",
  varsayilanMod: "acik",
  varsayilanVurgu: "#b3341a",

  ustBaslik: function (c) {
    var k = c.kacir, i = c.isletme, sz = c.sz;
    var kapak = i.cover || "";
    var yer = [i.district, i.city].filter(Boolean).join(", ");
    var durum = i.isOpen === false ? sz.kapali : sz.acik;

    return '<header class="ust">' +
      (kapak ? '<div class="ust-kapak"><img src="' + k(kapak) + '" alt="" loading="eager"><div class="ust-perde"></div></div>' : '<div class="ust-kapak ust-kapak--bos"></div>') +
      '<div class="ust-ic">' +
        '<div class="ust-satir">' +
          '<span class="ust-durum' + (i.isOpen === false ? " kapali" : "") + '">' +
            '<span class="ust-nokta"></span>' + k(durum) + (i.hours ? " · " + k(i.hours) : "") +
          '</span>' +
          '<div class="ust-araclar">' + c.bilgiDugmesi() + c.dilHtml() + '</div>' +
        '</div>' +
        /* Ada/logoya dokunmak da bilgi kartını açar (premium menüdeki gibi). */
        '<div class="ust-kimlik" data-bilgi-ac>' +
          (i.logo ? '<img class="ust-logo" src="' + k(i.logo) + '" alt="' + k(i.name || "") + '" loading="eager">' : "") +
          '<h1 class="ust-ad">' + k(i.name || "") + '</h1>' +
          (yer ? '<p class="ust-yer">' + k(yer.toLocaleUpperCase("tr")) + '</p>' : "") +
        '</div>' +
      '</div>' +
    '</header>';
  },

  kategoriCubugu: function (c) {
    var k = c.kacir, kats = c.kategoriler();
    if (kats.length < 2) return "";
    return '<nav class="katlar" data-kategori-cubugu aria-label="Kategoriler">' +
      kats.map(function (kat) {
        return '<button type="button" class="kat" data-goto="' + k(kat.id) + '">' +
          '<span class="cat__name">' + k(kat.ad) + '</span></button>';
      }).join("") + '</nav>';
  },

  bolum: function (kat, ic, c) {
    var k = c.kacir, t = c.metin(kat);
    return '<section class="bolum" data-bolum="' + k(kat.id) + '">' +
      '<div class="bolum-ust">' +
        '<h2>' + k(t.ad) + '</h2>' +
        (t.desc ? '<p class="bolum-not">' + k(t.desc) + '</p>' : "") +
      '</div>' + ic + '</section>';
  },

  altBaslik: function (ad, c) {
    return '<h3 class="alt-baslik">' + c.kacir(ad) + '</h3>';
  },

  urun: function (u, c) {
    var k = c.kacir, t = c.metin(u);
    var rozet = c.rozetler(u).map(function (r) {
      return '<span class="rozet rozet--' + r.tur + '">' + k(r.ad) + '</span>';
    }).join("");
    var olcu = c.olculer(u).map(function (o) { return '<span class="olcu">' + k(o) + '</span>'; }).join("");
    var buyuk = !!u.image;

    return '<button type="button" class="kart' + (buyuk ? "" : " kart--yazi") + '" data-product="' + k(u.id) + '">' +
      (buyuk
        ? '<div class="kart-gorsel"><img src="' + k(u.image) + '" alt="' + k(t.ad) + '" loading="lazy">' +
          (rozet ? '<div class="kart-rozet">' + rozet + '</div>' : "") + '</div>'
        : (rozet ? '<div class="rozetler kart-rozet--yazi">' + rozet + '</div>' : "")) +
      '<div class="kart-govde">' +
        '<div class="kart-ust">' +
          '<span class="kart-ad">' + k(t.ad) + '</span>' +
          '<span class="kart-fiyat">' + k(c.fiyat(u)) + '</span>' +
        '</div>' +
        (t.desc ? '<p class="kart-aciklama">' + k(t.desc) + '</p>' : "") +
        (olcu ? '<div class="olculer">' + olcu + '</div>' : "") +
      '</div>' +
    '</button>';
  },

  altBilgi: function (c) {
    var k = c.kacir, i = c.isletme, b = [];
    if (i.phone) b.push('<a href="tel:' + k(String(i.phone).replace(/\s/g, "")) + '">' + k(i.phone) + '</a>');
    if (i.maps) b.push('<a href="' + k(i.maps) + '" target="_blank" rel="noopener">Yol tarifi</a>');
    if (i.instagram) b.push('<a href="' + k(i.instagram) + '" target="_blank" rel="noopener">Instagram</a>');
    if (i.googleReview) b.push('<a href="' + k(i.googleReview) + '" target="_blank" rel="noopener">Değerlendir</a>');
    return '<footer class="altbilgi">' +
      '<span>' + k(c.sz.kdv) + '</span>' +
      (b.length ? '<span class="altbilgi-baglar">' + b.join("") + '</span>' : "") +
      c.imza() +
    '</footer>';
  }
};

/* Motor örneği dışarıya açılır: renk/mod gibi ayarlar sayfayı baştan
   kurmadan uygulanabilsin (bkz. window.MENU.paletiUygula). */
if (VERI) { window.MENU = new window.MenuMotor(VERI, window.DERI); window.MENU.baslat("#menu"); }
</script>
